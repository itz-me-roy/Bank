{% extends 'base.html' %}
{% block title %}Sign Up - Bank App{% endblock %}
{% block content %}
<div class="card">
    <h1>Create Your Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <p class="muted">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>

{% endblock %}
