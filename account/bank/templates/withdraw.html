{% extends 'base.html' %}
{% block title %}Withdraw - Bank App{% endblock %}
{% block content %}
<div class="card">
    <h1>Withdraw Funds</h1>
    <p class="muted">Current Balance: ${{ account.balance }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn secondary">Withdraw</button>
    </form>
</div>
{% endblock %}
