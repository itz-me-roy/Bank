{% extends 'base.html' %}
{% block title %}Deposit - Bank App{% endblock %}
{% block content %}
<div class="card">
    <h1>Deposit Funds</h1>
    <p class="muted">Current Balance: ${{ account.balance }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Deposit</button>
    </form>
</div>
{% endblock %}
