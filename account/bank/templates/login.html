{% extends 'base.html' %}
{% block title %}Login - Bank App{% endblock %}
{% block content %}
<div class="card">
    <h1>Login to Your Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p class="muted">Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
</div>
{% endblock %}
